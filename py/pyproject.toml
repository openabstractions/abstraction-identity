[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abstraction-ipc"
version = "0.0.0"
description = "Python client binding for the shared OpenAbstractions IPC C ABI"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["abstraction.ipc*"]
namespaces = true
